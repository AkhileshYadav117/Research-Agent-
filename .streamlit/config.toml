[theme]
base = "dark"
primaryColor = "#f472b6"
backgroundColor = "#040d21"
secondaryBackgroundColor = "#0a0f2e"
textColor = "#e2e8f0"
font = "sans serif"

[server]
headless = true
enableCORS = false
enableXsrfProtection = false
port = 8501

[browser]
gatherUsageStats = false

[runner]
fastReruns = true
